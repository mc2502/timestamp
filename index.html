<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f9">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TimeStamp">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="식단 사진에 날짜와 시각을 남기고 달력으로 돌아보는 앱">
<title>TimeStamp</title>
<link rel="manifest" href="manifest.webmanifest?v=110">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=110">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=110">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css?v=110">
<script>
  // 느린 시작은 저장본을 지우거나 자동 새로고침하지 않는다.
  window.setTimeout(function () {
    if (window.__tsBooted) return;
    var status = document.getElementById('boot-status');
    if (status) { status.hidden = false; status.querySelector('span').textContent = '연결이 느려 조금 더 기다리고 있어요'; }
    var retry = document.getElementById('boot-retry');
    if (retry) retry.hidden = false;
  }, 6000);
</script>
<script type="module" src="js/app.js?v=110"></script>
</head>
<body>
<div id="app" class="app">
  <main id="main">
    <!-- 앨범: 사진이 주인공 -->
    <section class="view" id="view-album" aria-labelledby="album-t">
      <!-- PT Note 머리: 큰 제목 + 오른쪽 회색 요약. 스크롤하면 위로 올라간다 -->
      <header class="page-head">
        <h1 class="page-t" id="album-t">앨범</h1>
        <span class="page-meta" id="album-meta"></span>
      </header>
      <!-- 끼니 세그먼트 + 설정: 위에 붙어 따라오고, 사진이 밑으로 지나가면 유리 + 가는 선 -->
      <div class="topbar topbar-tools">
        <div class="seg-filter" id="filters" role="group" aria-label="끼니로 거르기"></div>
        <div class="btn-pill">
          <button type="button" id="open-settings" aria-label="설정" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></svg></button>
        </div>
      </div>

      <!-- 오늘 카드: 첫 화면의 그날 캐릭터가 사진이 생긴 뒤에도 여기 남는다 (보여 주기만) -->
      <div class="today-card" id="today-card" hidden>
        <img class="today-hero" data-art="hero" alt="" aria-hidden="true" width="64" height="64">
        <span class="today-text"><b id="today-t"></b><span id="today-s"></span></span>
      </div>

      <!-- 사진이 하나도 없을 때 -->
      <div class="intro" id="album-intro" hidden>
        <div class="hero-art"><img class="hero-main" data-art="hero" alt="" aria-hidden="true" width="184" height="184"></div>
        <h2>첫 식단 사진을<br>남겨 볼까요?</h2>
        <p>가운데 카메라 버튼을 누르면 바로 찍어요.<br>길게 누르면 앨범에서 골라요.</p>
      </div>

      <div class="boot-status" id="boot-status" role="status"><span>사진첩을 펼치고 있어요</span><button type="button" id="boot-retry" hidden onclick="location.reload()">다시 열기</button></div>
      <div id="album-grid"></div>
      <div class="empty" id="filter-empty" hidden><img data-art="empty" alt="" aria-hidden="true" width="104" height="104"><span id="filter-empty-text"></span></div>
    </section>

    <!-- 달력 -->
    <section class="view" id="view-calendar" aria-labelledby="cal-t" hidden>
      <header class="page-head">
        <h1 class="page-t" id="cal-t">달력</h1>
        <span class="page-meta" id="cal-meta"></span>
      </header>

      <!-- PT Note 카드: 머리에 달과 이전 · 다음, 사진을 남긴 날에는 마스코트 얼굴 스탬프 -->
      <section class="pt-card cal-card" aria-labelledby="mon-t">
        <div class="pt-card-head">
          <div class="pt-card-title">
            <h2 id="mon-t"></h2>
            <p id="mon-sum"></p>
          </div>
          <div class="pt-nav">
            <button type="button" id="mon-prev" aria-label="이전 달"><i></i></button>
            <button type="button" id="mon-next" aria-label="다음 달"><i></i></button>
          </div>
        </div>
        <div class="cal" id="cal"></div>
      </section>

      <!-- 고른 날의 밥상: 그날 남긴 끼니에 따라 바뀌는 캐릭터 + 아침 · 점심 · 저녁 세 칸.
           사진이 있으면 체크, 빈 칸을 누르면 그 끼니로 바로 찍기(오늘) · 고르기(지난날) -->
      <section class="meal-card" aria-labelledby="day-title">
        <div class="mc-head"><h3 id="day-title"></h3><span id="day-say"></span></div>
        <div class="mc-body">
          <img class="mc-char" id="day-char" alt="" aria-hidden="true" width="84" height="84">
          <div class="mc-slots" id="day-slots"></div>
        </div>
      </section>
    </section>
  </main>

  <nav class="tabs" aria-label="주 메뉴"><div class="tabs-in">
    <button class="tab on" type="button" data-view="album" aria-current="page" aria-label="앨범"><svg class="nav-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 8h.01"/><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12"/><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5"/><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3"/></svg></button>
    <button class="add" type="button" id="add" aria-label="사진 찍기, 길게 누르면 앨범에서 고르기" aria-haspopup="true" aria-controls="add-pop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7h1a2 2 0 0 0 2 -2a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2"/><path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></svg></button>
    <button class="tab" type="button" data-view="calendar" aria-label="달력"><svg class="nav-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/><path d="M7 14h.013"/><path d="M10.01 14h.005"/><path d="M13.01 14h.005"/><path d="M16.015 14h.005"/><path d="M13.015 17h.005"/><path d="M7.01 17h.005"/><path d="M10.01 17h.005"/></svg></button>
  </div></nav>
  <!-- 가운데 카메라를 길게 누르면 바로 위에 뜨는 ‘앨범’ 버튼 (누른 채 올려서 놓아도 골라진다) -->
  <div class="add-pop" id="add-pop" hidden>
    <button type="button" id="add-album" aria-label="앨범에서 사진 고르기"><img class="add-album-art" data-art="album" alt="" aria-hidden="true" width="54" height="54"></button>
  </div>
</div>

<!-- 가운데 버튼: 아이폰이 ‘사진 보관함 · 사진 찍기 · 파일 선택’ 메뉴를 띄운다 -->
<input class="vh" type="file" id="input-photo" accept="image/*" tabindex="-1" aria-hidden="true">
<!-- 시작 화면의 셔터: 기본 카메라를 바로 연다 -->
<input class="vh" type="file" id="input-camera" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">

<!-- 즉시 저장 알림 -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span class="toast-face" aria-hidden="true"></span>
  <span class="toast-text" id="toast-text"></span>
</div>

<!-- 당겨서 새로고침: 다음에 올 마스코트 얼굴이 굴러 들어온다 (PT Note) -->
<div class="pull-refresh has-face" id="pull" role="status" aria-live="polite" hidden>
  <img class="pull-refresh-face" id="pull-face" alt="" aria-hidden="true" width="28" height="28">
  <span class="pull-refresh-label" id="pull-label"></span>
  <i class="pull-refresh-dots" aria-hidden="true"><b></b><b></b><b></b></i>
</div>

<!-- 앱 열면 바로 카메라 -->
<div class="sheet" id="launch" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="launch-t">
    <div class="sheet-h">
      <div class="ht"><b>TimeStamp</b><span id="launch-date"></span></div>
      <button class="sheet-x" type="button" data-close aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-b launch-b">
      <div class="pt-entry-hero">
        <div><b id="launch-t">식단 사진을<br>찍어 볼까요?</b><p>찍는 순간의 날짜와 시간이<br>사진에 함께 남아요</p></div>
        <div class="hero-art is-small"><img class="hero-main" data-art="hero" alt="" aria-hidden="true" width="112" height="112"></div>
      </div>
      <button class="shutter" type="button" id="launch-shoot" data-autofocus aria-label="사진 찍기"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7h1a2 2 0 0 0 2 -2a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2"/><path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></svg></span></button>
      <button class="pt-text-button launch-album" type="button" id="launch-album">사진 앨범에서 고르기</button>
    </div>
  </div>
</div>

<!-- 설정 (앨범 오른쪽 위 톱니) -->
<div class="sheet" id="settings" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="settings-t">
    <div class="sheet-h">
      <div class="ht"><b id="settings-t">설정</b></div>
      <button class="sheet-x" type="button" data-close aria-label="닫기" data-autofocus><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-b">
      <section class="set-group">
        <label class="set-row">
          <span class="set-m"><b>앱 열면 바로 카메라</b><span id="d-launch">앱을 열면 촬영 버튼부터 보여요. 아이폰에서는 한 번 눌러야 카메라가 열려요.</span></span>
          <span class="switch"><input type="checkbox" role="switch" data-setting="launchCamera" aria-describedby="d-launch"><i aria-hidden="true"></i></span>
        </label>
        <label class="set-row">
          <span class="set-m"><b>즉시 저장</b><span id="d-instant">스탬프 화면 없이, 마지막에 쓴 스탬프로 바로 앨범에 남겨요.</span></span>
          <span class="switch"><input type="checkbox" role="switch" data-setting="instantSave" aria-describedby="d-instant"><i aria-hidden="true"></i></span>
        </label>
        <label class="set-row">
          <span class="set-m"><b>사진에 남은 촬영 시각 쓰기</b><span id="d-phototime">앨범에서 고른 사진은 찍힌 시각으로 스탬프를 찍어요. 끄면 지금 시각으로 넣고, 스탬프 화면에서 바꿀 수 있어요.</span></span>
          <span class="switch"><input type="checkbox" role="switch" data-setting="photoTime" aria-describedby="d-phototime"><i aria-hidden="true"></i></span>
        </label>
        <label class="set-row">
          <span class="set-m"><b>셔터 소리 · 스탬프 효과</b><span id="d-effects">스탬프가 찍힐 때 소리와 움직임이 나와요. 무음 모드에서는 소리가 나지 않아요.</span></span>
          <span class="switch"><input type="checkbox" role="switch" data-setting="effects" aria-describedby="d-effects"><i aria-hidden="true"></i></span>
        </label>
      </section>

      <section class="set-group">
        <p class="set-p" id="storage-note"></p>
        <div class="backup-actions"><button type="button" id="backup-export">백업 파일 만들기</button><button type="button" id="backup-import">백업에서 되살리기</button></div>
        <p class="set-p backup-status" id="backup-status" role="status">복원할 때 기존 사진은 바꾸지 않고, 없는 기록만 추가해요</p>
        <input class="vh" type="file" id="input-backup" accept=".timestamp,application/octet-stream" tabindex="-1" aria-hidden="true">
      </section>

      <section class="set-group set-app" aria-label="앱 정보">
        <div class="set-about">
          <img class="about-icon" src="assets/icons/icon-192.png?v=110" alt="" aria-hidden="true" width="40" height="40">
          <div class="set-app-name"><b>TimeStamp</b><span id="app-version"></span></div>
          <button class="pt-text-button" type="button" id="refresh-now">새로고침</button>
        </div>
        <details class="release-notes" id="release-notes">
          <summary>업데이트 노트<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7l-7 7"/></svg></summary>
          <div id="release-list"></div>
        </details>
      </section>
    </div>
  </div>
</div>

<!-- 스탬프 화면: PT Note 밝은 화면. 사진이 카드처럼 떠 있고, 아래에서 캐릭터 스탬프부터 고른다 -->
<div class="sheet sheet-full" id="editor" hidden>
  <div class="editor" role="dialog" aria-modal="true" aria-labelledby="ed-t">
    <header class="ed-top">
      <button class="ed-icon" type="button" id="ed-close" aria-label="닫기" data-autofocus><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
      <b class="ed-title" id="ed-t">스탬프 찍기</b>
      <button class="ed-text" type="button" id="crop-reset" hidden>원래대로</button>
    </header>

    <div class="ed-stage">
      <div class="ed-photo" id="preview">
        <div class="preview-skel" id="preview-skel"><img class="skel-face" data-art="face" alt="" aria-hidden="true" width="56" height="56"><span>사진을 준비하고 있어요</span></div>
        <canvas id="preview-canvas" role="img" aria-label="스탬프가 찍힌 정사각형 사진 미리보기" hidden></canvas>
        <p class="ed-hint" id="ed-hint" aria-hidden="true">끌어서 옮기고, 두 손가락으로 줄이거나 키워요</p>
        <button class="ed-fit" type="button" id="ed-fit" aria-label="사진 전체 보기" hidden>
          <svg class="i-shrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 9h4v-4"/><path d="M3 3l6 6"/><path d="M5 15h4v4"/><path d="M3 21l6 -6"/><path d="M19 9h-4v-4"/><path d="M15 9l6 -6"/><path d="M19 15h-4v4"/><path d="M15 15l6 6"/></svg>
          <svg class="i-grow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M16 4h4v4"/><path d="M14 10l6 -6"/><path d="M8 20h-4v-4"/><path d="M4 20l6 -6"/><path d="M16 20h4v-4"/><path d="M14 14l6 6"/><path d="M8 4h-4v4"/><path d="M4 4l6 6"/></svg>
        </button>
      </div>
    </div>

    <section class="ed-panel" aria-label="스탬프 꾸미기">
      <div class="st-tiles" id="style-strip" role="radiogroup" aria-label="스탬프"></div>

      <!-- 끼니 막대: 이름이 막대 안 제자리에 있고, 흰 손잡이를 끌거나 이름을 눌러서 고른다 -->
      <div class="ed-meal" id="meal-seg">
        <div class="mp-track" id="meal-track" role="slider" tabindex="0" aria-label="끼니" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1" aria-valuetext="점심">
          <span class="mp-records" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="mp-thumb"></span>
          <span class="mp-labels" aria-hidden="true"><span>아침</span><span>점심</span><span>저녁</span><span>간식</span><span>없음</span></span>
        </div>
      </div>

      <div class="ed-feedback" id="ed-feedback" role="status" aria-live="polite" aria-atomic="true">
        <img id="ed-existing-photo" alt="" width="34" height="34" hidden>
        <div class="ed-feedback-copy"><span id="ed-feedback-title"></span><span id="ed-feedback-detail"></span></div>
      </div>

      <div class="ed-row">
        <span class="ed-time" id="ed-time-pill"><svg class="ed-time-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 7v5l3 3"/></svg><span id="ed-time-text"></span><i class="chev-d" aria-hidden="true"></i><input type="datetime-local" id="ed-time" aria-label="촬영 시각"></span>
        <div class="swatches" id="swatches" role="radiogroup" aria-label="글자색">
          <button type="button" role="radio" data-color="white" aria-label="흰색" aria-checked="true"><i></i></button>
          <button type="button" role="radio" data-color="sky" aria-label="하늘색" aria-checked="false"><i></i></button>
          <button type="button" role="radio" data-color="mint" aria-label="민트" aria-checked="false"><i></i></button>
        </div>
      </div>

      <div class="ed-actions">
        <button class="btn sub" type="button" id="ed-save" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 11l5 5l5 -5"/><path d="M12 4l0 12"/></svg>앨범 저장</button>
